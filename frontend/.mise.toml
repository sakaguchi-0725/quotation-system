[tools]
pnpm = "10.6.0"

[tasks.setup]
description = ".env.exampleから.envを生成"
run = "test -f .env || cp .env.example .env"

[tasks.dev]
run = "pnpm dev"

[tasks.lint]
run = "pnpm lint"

[tasks."lint:staged"]
run = "pnpm lint:staged"

[tasks.format]
run = "pnpm format"

[tasks."format:staged"]
run = "pnpm format:staged"

[tasks.build]
run = "pnpm build"
